name: CI Pipeline

on:
  workflow_dispatch:

jobs:
  docker-setup:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Build the Docker image
        run: docker build --no-cache -t planet-wars-ci .

      - name: Run the best agent inside container for 20 seconds
        run: docker run --rm planet-wars-ci bash -lc 'set -x; timeout 20s ./run_sharp_agent.sh headless || [ $? -eq 124 ]'

  train-small-and-run:
    name: Train tiny agent and run headless
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Make the setup and running scripts executable
        run: chmod +x setup.sh run_sharp_agent.sh

      - name: Run setup script
        run: ./setup.sh noenv

      - name: Make the default config very minimal
        run: |
          sed -i 's/^hidden_sizes:.*/hidden_sizes: [4]/' config1.yaml
          sed -i 's/^games_per_eval:.*/games_per_eval: 2/' config1.yaml
          sed -i 's/^gens:.*/gens: 2/' config1.yaml

      - name: Train the minimal agent
        run: python3 train_nn.py --config config1.yaml

      - name: Extract the best minimal agent
        run: python3 extract_agent.py

      - name: Run headless agent for 20s
        run: timeout 20s bash ./run_sharp_agent.sh headless || [ $? -eq 124 ]
